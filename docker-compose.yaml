services:
  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      # the container's own build cache; sharing frontend/.next with the host
      # lets two different builds corrupt Turbopack's cache
      - frontend_next:/app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5001
      # the web server's own requests (link previews) go container to container
      INTERNAL_API_URL: http://backend:5001
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile.dev
    ports:
      - "5001:5001"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    env_file: ./backend/.env
    environment:
      PORT: 5001
      NODE_ENV: development
      # browser tests sign in and reload faster than any person:
      # THROTTLE_DISABLED=true docker compose up -d backend
      THROTTLE_DISABLED: ${THROTTLE_DISABLED:-false}
      # a pretend Stripe: paid tickets work with no keys, every checkout paid at once
      # (set STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET in backend/.env, and this to false, for Stripe's test mode)
      PAYMENTS_FAKE: ${PAYMENTS_FAKE:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: muster-db
    env_file: ./backend/.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres17_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  frontend_node_modules:
  frontend_next:
  backend_node_modules:
  # the Postgres 13 volume (postgres_data) is kept until the move is confirmed;
  # remove it with: docker volume rm muster_postgres_data
  postgres17_data:
